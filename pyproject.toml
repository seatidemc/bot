[project]
name = "seatide-bot"
version = "0.1.0"
description = "Seatide MC 服务器 QQ 机器人"
requires-python = ">=3.11"
dependencies = [
    "nonebot2[fastapi]>=2.4.0",
    "nonebot-adapter-onebot>=2.4.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.21.0",
]

[tool.nonebot]
adapters = ["nonebot.adapters.onebot.v11"]
plugins = ["src.plugins"]

[project]
name = "seatide-bot"
version = "0.1.0"
description = "Seatide MC 服务器 QQ 机器人"
requires-python = ">=3.11"
dependencies = [
    "nonebot2[fastapi,websockets]>=2.4.0",
    "nonebot-adapter-qq>=1.7.0",
    "httpx>=0.28.0",
    "openai>=3.0.0,<4",
    "typesafe-sdk>=0.7.5,<0.8",
]

[tool.nonebot]
adapters = ["nonebot.adapters.qq"]
plugins = ["src.plugins"]
